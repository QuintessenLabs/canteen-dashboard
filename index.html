<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen seat map</title>
<style>
:root{color-scheme:dark;--paper:#102541;--line:#c1d8ef;--muted:#adc5dd;--free:#82e7cf;--low:#ffd792;--full:#ffacb1;--cam:#d9baff}
*{box-sizing:border-box}
body{margin:0;background:#0a192d;color:#eff7ff;font:16px "Segoe UI",sans-serif}
main{max-width:1460px;margin:auto;padding:clamp(16px,4vw,48px)}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:clamp(30px,4vw,52px);letter-spacing:-.045em;line-height:1}
p{margin:.55rem 0;color:var(--muted)}
.actions,.totals,.legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
button{font:inherit;border:1px solid #6b87a3;border-radius:5px;background:#193652;color:#fff;padding:9px 13px;cursor:pointer}
button:hover{background:#254968}
button:focus-visible,input:focus-visible{outline:2px solid var(--free);outline-offset:4px}
figure{margin:0;border:1px solid #54728e;background:var(--paper)}
.totals{padding:14px 20px;border-bottom:1px solid #54728e}
.totals strong{color:var(--free);font-size:25px;font-variant-numeric:tabular-nums}
.totals span{white-space:nowrap}
.scroll{overflow:auto;background-image:linear-gradient(#48698b2b 1px,transparent 1px),linear-gradient(90deg,#48698b2b 1px,transparent 1px);background-size:22px 22px}
svg{display:block;width:100%;min-width:840px}
svg text{dominant-baseline:central;fill:#e4f2ff;stroke:none}
.WALL,.DOOR,.FIXTURE,.TABLE,.CHAIR,.STANDING,.CAMERA,.CAMERA_LINK{fill:none;stroke:var(--line);stroke-width:2}
.WALL{stroke-width:5;stroke-linejoin:round}
.FIXTURE{fill:#193957;stroke:#8eaac5;stroke-width:2.5}
.DOOR{stroke:#ffd792}
text.STANDING{stroke:none;fill:var(--muted)}
.RESERVED{fill:var(--cam)}
rect.CAMERA{fill:#312957;stroke:var(--cam)}
.CAMERA_LINK{stroke:var(--cam);stroke-opacity:.48;stroke-width:2;stroke-dasharray:9 7}
#coverage[hidden]{display:none}
rect.TABLE,rect.STANDING{stroke:var(--status);fill:#17354c}
.CHAIR{stroke:var(--status);opacity:.72}
.available{fill:var(--status);font-size:23px;font-weight:700}
.item{--status:var(--free)}
.item.low{--status:var(--low)}
.item.full{--status:var(--full)}
figcaption{padding:14px 20px;border-top:1px solid #54728e;color:var(--muted);font-size:14px}
.legend{margin-bottom:6px}
.legend b{color:var(--free)} .legend .low{color:var(--low)} .legend .full{color:var(--full)}

:root{color-scheme:light;--paper:#fff;--line:#252525;--muted:#4a4a4a;--free:#075344;--low:#754000;--full:#7c1d30;--cam:#343434}
body{background:#fff;color:#111}
figure,.totals,figcaption{border-color:#aaa}
.scroll{background-image:none}
button{background:#fff;color:#111;border-color:#444}
button:hover{background:#eee}
svg text{fill:#161616}
.FIXTURE{fill:#f2f2f2;stroke:#222}
.DOOR{stroke:#333}
rect.CAMERA{fill:#e4e4e4;stroke:#333}
rect.TABLE,rect.STANDING{fill:#fff}
.item .available{fill:var(--status)}
.legend b{border:1px solid currentColor;padding:2px 7px;background:#fff}
</style>

<script>
const records = [{"id": "T01", "camera": "C01", "capacity": 6}, {"id": "T02", "camera": "C01", "capacity": 6}, {"id": "T03", "camera": "C01", "capacity": 6}, {"id": "T04", "camera": "C02", "capacity": 6}, {"id": "T05", "camera": "C02", "capacity": 6}, {"id": "T06", "camera": "C02", "capacity": 6}, {"id": "T07", "camera": "C02", "capacity": 6}, {"id": "T08", "camera": "C02", "capacity": 6}, {"id": "T09", "camera": "C02", "capacity": 6}, {"id": "T10", "camera": "C02", "capacity": 6}, {"id": "T11", "camera": "C02", "capacity": 6}, {"id": "S01", "camera": "C03", "capacity": 3}, {"id": "S02", "camera": "C03", "capacity": 3}, {"id": "S03", "camera": "C03", "capacity": 3}, {"id": "S04", "camera": "C03", "capacity": 3}, {"id": "T12", "camera": "C04", "capacity": 6}, {"id": "T13", "camera": "C04", "capacity": 6}, {"id": "T14", "camera": "C04", "capacity": 6}, {"id": "T15", "camera": "C04", "capacity": 6}, {"id": "T16", "camera": "C04", "capacity": 6}, {"id": "T17", "camera": "C04", "capacity": 6}, {"id": "T18", "camera": "C04", "capacity": 6}, {"id": "T19", "camera": "C04", "capacity": 6}, {"id": "T20", "camera": "C04", "capacity": 6}, {"id": "S05", "camera": "C04", "capacity": 3}, {"id": "S06", "camera": "C04", "capacity": 3}, {"id": "T21", "camera": "C05", "capacity": 6}, {"id": "T22", "camera": "C05", "capacity": 6}, {"id": "T23", "camera": "C05", "capacity": 6}, {"id": "T24", "camera": "C05", "capacity": 6}, {"id": "T25", "camera": "C05", "capacity": 6}];
const general = document.querySelector('#general');
const reserved = document.querySelector('#reserved');
const standing = document.querySelector('#standing');
let frame = 0;
function render() {
  const free = {general: 0, reserved: 0, standing: 0};
  records.forEach(({id, camera, capacity}, index) => {
    const available = (index * 11 + Math.floor(index / 3) + frame) % (capacity + 1);
    const group = document.querySelector('[data-id="' + id + '"]');
    group.querySelector('title').textContent = id + ' · ' + available + ' of ' + capacity + ' free · ' + camera;
    group.querySelector('.available').textContent = available;
    group.classList.toggle('full', available === 0);
    group.classList.toggle('low', available > 0 && available < 3);
    const category = capacity === 3 ? 'standing' : camera === 'C05' ? 'reserved' : 'general';
    free[category] += available;
  });
  general.textContent = free.general + ' / 120';
  reserved.textContent = free.reserved + ' / 30';
  standing.textContent = free.standing + ' / 18';
}
document.querySelector('#sample').addEventListener('click', () => { frame++; render(); });
document.querySelector('#toggle').addEventListener('change', event => {
  document.querySelector('#coverage').toggleAttribute('hidden', !event.target.checked);
});
render();
</script></html>
